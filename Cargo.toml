[workspace]
members = ["crates/shadowmist-core", "crates/shadowmist-platform-linux", "crates/shadowmist-daemon", "crates/shadowmist-cli", "crates/shadowborn-core", "crates/shadowborn-platform", "crates/shadowborn-cli"]
default-members = ["crates/shadowborn-core", "crates/shadowborn-platform", "crates/shadowborn-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "process", "sync"] }
libc = "0.2"
fs2 = "0.4"
tempfile = "3.16"
shadowmist-core = { path = "crates/shadowmist-core" }
shadowmist-platform-linux = { path = "crates/shadowmist-platform-linux" }

[profile.release]
lto = "thin"
strip = true

