name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: sudo apt-get update && sudo apt-get install -y shellcheck wireguard-tools nftables unbound age
      - run: shellcheck scripts/*.sh
      - run: cargo build --locked -p shadowborn-core --example render_lab
      - run: python3 tests/integration/shadowborn.py
      - run: python3 tests/integration/provisioning.py
      - run: python3 tests/integration/generated.py
      - run: python3 tests/namespaces/shadowborn.py
      - run: python3 tests/integration/smoke.py --skip-daemon
  aarch64-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --locked --workspace --target aarch64-unknown-linux-gnu
